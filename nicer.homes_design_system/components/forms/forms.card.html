<script type="text/babel">
const {Input,Select,Checkbox,Radio,Switch,InputWithSelectField}=window.NicerHomesDesignSystem_ea7f10;
function Demo(){
const [c,setC]=React.useState(true);
const [r,setR]=React.useState('weekly');
const [s,setS]=React.useState(true);
const [mc,setMc]=React.useState('');
return (
<div style={{display:'flex',flexDirection:'column',gap:16,maxWidth:320}}>
<Input label="Nightly rate" prefix="Rp" defaultValue="4,850,000" />
<Input label="Guest email" placeholder="you@email.com" error="Required" />

<Checkbox label="Include cleaning fee" checked={c} onChange={setC} />
<div style={{display:'flex',gap:16}}>
<Radio label="Weekly" checked={r==='weekly'} onChange={()=>setR('weekly')} />
<Radio label="Monthly" checked={r==='monthly'} onChange={()=>setR('monthly')} />
</div>
<Switch label="Dynamic pricing" checked={s} onChange={setS} />
<InputWithSelectField label="Minimum competitor count" value={mc} onChange={setMc} options={[{label:'Global: 3',value:'',linked:true}]} />
</div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
