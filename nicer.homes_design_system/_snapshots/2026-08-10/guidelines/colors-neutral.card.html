<div style="display:flex;height:200px;font-family:var(--font-mono);font-size:11px;color:#fff">
<div style="flex:1;background:var(--color-white);color:var(--color-ink-900);border:1px solid var(--border-default);display:flex;align-items:flex-end;padding:8px">white</div>
<div style="flex:1;background:var(--color-mist);color:var(--color-ink-900);display:flex;align-items:flex-end;padding:8px">mist</div>

<div style="flex:1;background:var(--color-ink-400);display:flex;align-items:flex-end;padding:8px">ink-400</div>
<div style="flex:1;background:var(--color-ink-600);display:flex;align-items:flex-end;padding:8px">ink-600</div>
<div style="flex:1;background:var(--color-ink-900);display:flex;align-items:flex-end;padding:8px">ink-900</div>
