<link rel="stylesheet" href="../styles.css">
<div style="height:160px;display:flex;gap:20px;align-items:center;padding:0 24px;background:var(--surface-page)">
<div style="width:90px;height:90px;background:var(--surface-card-solid);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div>
<div style="width:90px;height:90px;background:var(--surface-card-solid);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div>
<div style="width:90px;height:90px;background:var(--surface-card-solid);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div>
<div style="width:90px;height:90px;background:var(--surface-card-solid);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg)"></div>
<div style="width:90px;height:90px;background:var(--color-accent-500);border-radius:var(--radius-lg);box-shadow:var(--glow-accent)"></div>
