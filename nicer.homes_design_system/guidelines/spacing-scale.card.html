<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="4px base unit" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:140px;display:flex;align-items:flex-end;gap:10px;padding:16px 24px;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:4px;height:4px;background:var(--action-accent)"></div>4</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:8px;background:var(--action-accent)"></div>8</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:16px;height:16px;background:var(--action-accent)"></div>16</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:24px;background:var(--action-accent)"></div>24</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:32px;background:var(--action-accent)"></div>32</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:48px;background:var(--action-accent)"></div>48</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--action-accent)"></div>64</div>
</div>
