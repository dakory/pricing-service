<!-- @dsCard group="Colors" viewport="700x120" name="Semantic Tokens" subtitle="status + surface aliases" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;height:120px;font-family:var(--font-sans);font-size:12px;padding:4px">
<div style="flex:1;background:var(--surface-card);backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);box-shadow:var(--shadow-sm)">surface-card</div>
<div style="flex:1;background:var(--surface-sunken);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-secondary)">surface-sunken</div>
<div style="flex:1;background:var(--status-danger-soft);color:var(--status-danger);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center">danger</div>
<div style="flex:1;background:var(--status-success-soft);color:var(--status-success);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center">success</div>
</div>
